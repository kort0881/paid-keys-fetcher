name: Fetch Paid Keys

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch paid keys
        run: python fetch_paid_keys.py
        env:
          PAID_URL: ${{ secrets.PAID_URL }}
          UA: v2rayN/6.23

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paid-keys
          path: results/paid.txt
          retention-days: 1
          if-no-files-found: error
